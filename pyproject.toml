[project]
name = "agent-torture-lab"
version = "0.1.0"
description = "Automated attack harness for a small tool-using LLM agent, with switchable defences and measured results."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
